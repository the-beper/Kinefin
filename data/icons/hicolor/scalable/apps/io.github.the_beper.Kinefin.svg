<!-- KDE HIG colorful application icon: 48 px baseline, 4 px margins, light from above, 1 px hard shadow under the base, 45 degree shadow of the foreground that fades out inside the base. A fin (Kinefin) with a play button, on a teal base. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="base" x1="0" y1="4" x2="0" y2="43" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2fd3b0"/><stop offset="1" stop-color="#1f6f8f"/></linearGradient>
    <linearGradient id="foreground" x1="0" y1="8" x2="0" y2="38" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fcfcfc"/><stop offset="1" stop-color="#d6c8ee"/></linearGradient>
    <linearGradient id="fade" x1="14" y1="10" x2="42" y2="38" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="shadowFade" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48"><rect width="48" height="48" fill="url(#fade)"/></mask>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48"><rect width="48" height="48" fill="#fff"/></mask>
    <clipPath id="baseShape"><rect x="4" y="4" width="40" height="39" rx="6"/></clipPath>
    <g id="fg"><path d="M10.5 38 C12 23 19 12 30.5 6.5 C29.8 16 32 28 38 38 C30 35.5 19 35.5 10.5 38 Z" stroke-width="1.2" stroke-linejoin="round"/></g>
  </defs>
  <rect x="4" y="5" width="40" height="39" rx="6" fill="#000" fill-opacity="0.1"/>
  <rect x="4" y="4" width="40" height="39" rx="6" fill="url(#base)"/>
  <g clip-path="url(#baseShape)" mask="url(#shadowFade)" opacity="0.28"><use href="#fg" transform="translate(3 3)" fill="#000" stroke="#000"/></g>
  <use href="#fg" fill="url(#foreground)" stroke="url(#foreground)"/>
  <path d="M20.5 21.5 L30 27 L20.5 32.5 Z" fill="#7a4fb8" stroke="#7a4fb8" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
