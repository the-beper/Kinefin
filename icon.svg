<!-- Kinefin release icon: an ascending fin with a play glyph. Original vector artwork.
     Aligned to a 48px KDE application-icon grid, with a 4px optical margin. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="tile" x1="10" y1="3" x2="38" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#28cfb8"/>
      <stop offset="0.54" stop-color="#189fac"/>
      <stop offset="1" stop-color="#24547b"/>
    </linearGradient>
    <linearGradient id="fin" x1="15" y1="10" x2="30" y2="39" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.56" stop-color="#f5edff"/>
      <stop offset="1" stop-color="#cdb9ef"/>
    </linearGradient>
    <linearGradient id="play" x1="20" y1="21" x2="31" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8d58d6"/>
      <stop offset="1" stop-color="#60389d"/>
    </linearGradient>
    <clipPath id="tile-shape"><rect x="4" y="4" width="40" height="39" rx="8"/></clipPath>
  </defs>
  <!-- The bottom edge has a short hard shadow, as in KDE's colorful icon style. -->
  <rect x="4" y="5" width="40" height="39" rx="8" fill="#092e49" opacity="0.22"/>
  <rect x="4" y="4" width="40" height="39" rx="8" fill="url(#tile)"/>
  <g clip-path="url(#tile-shape)">
    <path d="M12 38 C14.2 26.5 20.2 15.2 33.3 8.7 C31.7 20.1 34.1 30.3 38 38 C30.1 34.2 20.4 34 12 38 Z"
          transform="translate(1.5 2)" fill="#083a59" opacity="0.26"/>
    <path d="M12 38 C14.2 26.5 20.2 15.2 33.3 8.7 C31.7 20.1 34.1 30.3 38 38 C30.1 34.2 20.4 34 12 38 Z"
          fill="url(#fin)"/>
    <path d="M22 20.9 C21.45 20.55 20.8 20.95 20.8 21.6 L20.8 31.2 C20.8 31.85 21.45 32.25 22 31.9 L30.2 27.05 C30.75 26.72 30.75 26.08 30.2 25.75 Z"
          fill="url(#play)"/>
  </g>
  <path d="M12.1 7.5 H35.9" stroke="#c4fff2" stroke-opacity="0.24" stroke-width="0.65" stroke-linecap="round"/>
</svg>
