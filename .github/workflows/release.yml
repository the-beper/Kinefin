name: Release

# Pushing a tag vX.Y.Z builds, verifies and publishes a Flatpak-only release in jobs of one run, all for the same commit (github.sha). Keep this file small and boring: every job rebuilds nothing beyond what CI proved already (ci-gate).
#
# validate       the tag names the version of the sources and the commit, which is on main ci-gate        the CI run for that commit, pushed to main, finished green build-flatpak  build and smoke-test the bundle verify         the exact SHA256SUMS publish        draft release, asset, then publish; rebuilds nothing and can be re-run after a failure
#
# The release image must be selected by its immutable SHA-256 digest (repository variable KINEFIN_RELEASE_FLATPAK_DIGEST). Port KuickShare's signed OSTree repository pipeline only if self-hosting (Flathub does not need it).
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check tag, CMake, AppStream and main ancestry
        id: check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Do not build or publish a tag whose release metadata was not bumped.
          python3 -I build/release/verify_release.py "$RELEASE_TAG"
          # The commit must be on main (a build of a stray branch is not a release).
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$GITHUB_SHA is not on main" >&2; exit 1; }
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify pinned Flatpak runtimes
        run: python3 -I build/release/verify_runtime_pins.py

      - name: Verify immutable Flatpak sources
        run: python3 -I build/release/verify_flatpak_sources.py

      # Review artifact for a future Flathub submission. This never publishes
      # anything and is independent of the GitHub Flatpak bundle release.
      - name: Prepare commit-pinned Flathub manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -I build/release/prepare_flathub.py "$RELEASE_TAG"

      - name: Verify generated Flathub sources
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -I build/release/verify_flatpak_sources.py \
            --manifest "dist/flathub/$RELEASE_TAG/io.github.the_beper.Kinefin.yml" \
            --flathub-tag "$RELEASE_TAG" --flathub-commit "$(git rev-parse HEAD)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flathub-manifest
          path: dist/flathub/${{ github.ref_name }}/io.github.the_beper.Kinefin.yml
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for the CI run of this commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=50" \
              --jq '.workflow_runs | sort_by(.id) | last | if . == null then "none" else "\(.status) \(.conclusion)" end')
            echo "CI run of the push of $GITHUB_SHA to main: $state"
            case $state in
              "completed success") exit 0 ;;
              "completed "*) echo "CI failed on this commit: fix it, push to main, and tag the new commit" >&2; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "CI has no finished run for the push of this commit to main after 20 minutes: push the commit to main and wait for it, then run this job again" >&2
              exit 1
            fi
            sleep 30
          done

  build-flatpak:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # The flatpak image is private on ghcr: log podman into it with this token.
      packages: read
    outputs:
      # Read by the `verify` job to compare against its downloaded copy.
      flatpak_sha256: ${{ steps.hash.outputs.flatpak }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Fail closed when the approved digest has not been configured. The
      # mutable :fedora45 image is used by CI only, never by a release.
      - name: Pull the pinned Flatpak release image
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          KINEFIN_RELEASE_FLATPAK_DIGEST: ${{ vars.KINEFIN_RELEASE_FLATPAK_DIGEST }}
        run: build/release/pull-pinned-image.sh

      - name: Build the Flatpak
        run: build/flatpak/build-flatpak.sh

      - name: Smoke test
        env:
          KINEFIN_EXPECT_VERSION: ${{ needs.validate.outputs.version }}
        run: build/flatpak/test-flatpak.sh dist/Kinefin-x86_64.flatpak

      - name: Hash
        id: hash
        run: echo "flatpak=$(sha256sum dist/Kinefin-x86_64.flatpak | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-flatpak
          path: dist/Kinefin-x86_64.flatpak
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  verify:
    needs: [build-flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asset-flatpak
          path: release-assets

      - name: Write and check SHA256SUMS
        env:
          EXPECT_SHA256_FLATPAK: ${{ needs.build-flatpak.outputs.flatpak_sha256 }}
        run: |
          cd release-assets
          sha256sum Kinefin-x86_64.flatpak > SHA256SUMS
          echo "$EXPECT_SHA256_FLATPAK  Kinefin-x86_64.flatpak" | sha256sum -c -

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: [ci-gate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Publish only after verifying both uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -I build/release/publish_release.py "$RELEASE_TAG" release-assets
