name: Release

# Pushing a tag vX.Y.Z builds, signs, verifies and publishes a Flatpak-only release in jobs of one run, all for the same commit (github.sha)
#
# validate        the tag names the version of the sources, is the newest vX.Y.Z tag, and its commit is on main
# ci-gate         the CI run for that commit, pushed to main, finished green
# build-flatpak   build and smoke-test the unsigned bundle on top of the published repository, export the new commit. No secret, no write permission
# prepare-flatpak the repository on top of gh-pages, unsigned: everything that parses the build's output. No secret
# check-flatpak   another keyless machine: checks everything prepare made and archives the checked repository
# sign-flatpak    the only job with the signing key (environment release-signing): signs the listed commits and the summary, makes nothing new
# finish-flatpak  another machine, no secret and no write permission: checks the signed repository as a client with only the public key, writes the site archive and the signed bundle. It does not install the bundle
# check-bundle    the only job that deploys the signed bundle (flatpak does it even with --no-deploy) and passes nothing on: with only its embedded key the installed commit is the listed app commit, signed by the pinned key. No write permission, token or secret, no output
# attest-flatpak  the only job that attests: the bundle bytes whose hash finish-flatpak reported, once check-bundle has passed
# verify          the attestation, PROVENANCE.json and the exact SHA256SUMS
# publish         the only job with write permission: draft release, assets, gh-pages, then publishes the release. Rebuilds nothing and can be re-run after a failure
#
# The release image must be selected by its immutable SHA-256 digest (repository variable KINEFIN_RELEASE_FLATPAK_DIGEST)
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SITE_URL: https://the-beper.github.io/Kinefin

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check tag, CMake, AppStream and main ancestry
        id: check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Do not build or publish a tag whose release metadata was not bumped.
          python3 -I build/release/verify_release.py "$RELEASE_TAG" --require-newest
          # The commit must be on main (a build of a stray branch is not a release).
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$GITHUB_SHA is not on main" >&2; exit 1; }
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify immutable GitHub Actions references
        run: python3 -I build/release/verify_action_pins.py

      - name: Verify pinned Flatpak runtimes
        run: python3 -I build/release/verify_runtime_pins.py

      - name: Verify immutable Flatpak sources
        run: python3 -I build/release/verify_flatpak_sources.py

      - name: Verify release artwork and desktop metadata
        run: python3 -I build/release/verify_release_branding.py

      - name: Verify reviewed Flatpak sandbox permissions
        run: python3 -I build/release/verify_flatpak_permissions.py

      # Review artifact for a future Flathub submission. This never publishes
      # anything and is independent of the GitHub Flatpak bundle release.
      - name: Prepare commit-pinned Flathub manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -I build/release/prepare_flathub.py "$RELEASE_TAG"

      - name: Verify generated Flathub sources
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -I build/release/verify_flatpak_sources.py \
            --manifest "dist/flathub/$RELEASE_TAG/io.github.the_beper.Kinefin.yml" \
            --flathub-tag "$RELEASE_TAG" --flathub-commit "$(git rev-parse HEAD)"

      - name: Verify generated Flathub permissions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -I build/release/verify_flatpak_permissions.py \
            --manifest "dist/flathub/$RELEASE_TAG/io.github.the_beper.Kinefin.yml"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flathub-manifest
          path: dist/flathub/${{ github.ref_name }}/io.github.the_beper.Kinefin.yml
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for the CI run of this commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=50" \
              --jq '.workflow_runs | sort_by(.id) | last | if . == null then "none" else "\(.status) \(.conclusion)" end')
            echo "CI run of the push of $GITHUB_SHA to main: $state"
            case $state in
              "completed success") exit 0 ;;
              "completed "*) echo "CI failed on this commit: fix it, push to main, and tag the new commit" >&2; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "CI has no finished run for the push of this commit to main after 20 minutes: push the commit to main and wait for it, then run this job again" >&2
              exit 1
            fi
            sleep 30
          done

  # Runs on the plain runner, not in a job container: the scripts start the build image with rootless podman. No secret, no write permission: the commits it exports are unsigned, on top of an anonymous clone of the published repository so that they keep their parent
  build-flatpak:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # The flatpak image is private on ghcr: log podman into it with this token
      packages: read
    outputs:
      image_digest: ${{ steps.pull.outputs.digest }}
      commits_sha256: ${{ steps.hash.outputs.commits }}
      refs_sha256: ${{ steps.hash.outputs.refs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Anonymous, the repository is public. No gh-pages yet means the first release, any other failure fails the job. Under dist/ because the manifest's directory source skips only .git and dist
      - name: Fetch the published repository
        run: |
          url="https://github.com/$GITHUB_REPOSITORY.git"
          heads=$(git ls-remote --heads "$url" gh-pages)
          mkdir -p dist
          if [ -n "$heads" ]; then
            git clone --quiet --depth 1 --branch gh-pages "$url" dist/pages
          else
            mkdir dist/pages
          fi

      # Fail closed when the approved digest has not been configured. The
      # mutable :fedora45 image is used by CI only, never by a release.
      - name: Pull the pinned Flatpak release image
        id: pull
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          KINEFIN_RELEASE_FLATPAK_DIGEST: ${{ vars.KINEFIN_RELEASE_FLATPAK_DIGEST }}
        run: |
          build/release/pull-pinned-image.sh
          # Record exactly the digest used by the build, even if repository
          # variables change before the downstream verify job starts.
          printf 'digest=%s\n' "$KINEFIN_RELEASE_FLATPAK_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build the Flatpak (unsigned)
        run: KINEFIN_FLATPAK_REPO="$PWD/dist/pages/repo" build/flatpak/build-flatpak.sh

      - name: Smoke test
        env:
          KINEFIN_EXPECT_VERSION: ${{ needs.validate.outputs.version }}
        run: build/flatpak/test-flatpak.sh dist/Kinefin-x86_64.flatpak

      # The ostree of the runner image, as in prepare-flatpak: the script only copies commits between repositories
      - name: Export the new commits
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ostree
          build/release/export-flatpak-commits.sh dist/pages dist/flatpak-commits

      - name: Hash
        id: hash
        run: |
          {
            echo "commits=$(sha256sum dist/flatpak-commits/flatpak-commits.tar | cut -d' ' -f1)"
            echo "refs=$(sha256sum dist/flatpak-commits/refs.txt | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-commits
          path: dist/flatpak-commits/flatpak-commits.tar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # What the build says it exported, on its own: the signing job checks the sign list against it
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-refs
          path: dist/flatpak-commits/refs.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Everything that parses what the build made, and everything that is generated: the unsigned repository on top of gh-pages, its summary and appstream data, the list of refs to sign. No environment, no secret (the script refuses to run with one), no write token
  prepare-flatpak:
    needs: [validate, build-flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      prepared_sha256: ${{ steps.prepare.outputs.prepared_sha256 }}
      signlist_sha256: ${{ steps.prepare.outputs.signlist_sha256 }}
      heads_sha256: ${{ steps.prepare.outputs.heads_sha256 }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree appstream librsvg2-common
          flatpak --version
          ostree --version | head -n 2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-commits
          path: flatpak-commits

      # GH_TOKEN is the read-only token of the job (contents: read): the script gives it to gh alone, to list the published releases
      - name: Prepare the Flatpak repository (unsigned)
        id: prepare
        env:
          EXPECT_COMMITS_SHA256: ${{ needs.build-flatpak.outputs.commits_sha256 }}
          EXPECT_REFS_SHA256: ${{ needs.build-flatpak.outputs.refs_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: build/release/prepare-flatpak-repo.sh flatpak-commits/flatpak-commits.tar flatpak-prepared

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-prepared
          path: |
            flatpak-prepared/prepared.tar
            flatpak-prepared/sign-list.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Checks everything prepare-flatpak made on a machine of its own with no environment and no secret, and archives the checked repository. The sign job takes that archive by artifact id and against the hash below. The environment approval is asked only when this job is green
  check-flatpak:
    needs: [validate, build-flatpak, prepare-flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      checked_sha256: ${{ steps.check.outputs.checked_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree
          flatpak --version
          ostree --version | head -n 2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-refs
          path: flatpak-refs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-prepared
          path: flatpak-prepared

      - name: Check what prepare-flatpak made
        id: check
        env:
          EXPECT_PREPARED_SHA256: ${{ needs.prepare-flatpak.outputs.prepared_sha256 }}
          EXPECT_SIGNLIST_SHA256: ${{ needs.prepare-flatpak.outputs.signlist_sha256 }}
          EXPECT_REFS_SHA256: ${{ needs.build-flatpak.outputs.refs_sha256 }}
          EXPECT_BASE_SHA: ${{ needs.prepare-flatpak.outputs.base_sha }}
          EXPECT_HEADS_SHA256: ${{ needs.prepare-flatpak.outputs.heads_sha256 }}
        run: build/release/sign-flatpak-repo.sh --check flatpak-prepared/prepared.tar flatpak-prepared/sign-list.txt flatpak-refs/refs.txt flatpak-checked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: flatpak-checked
          path: |
            flatpak-checked/checked-repo.tar
            flatpak-checked/sign-list.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # The only job that sees the signing key and the only one with an environment. The environment release-signing must exist with the secret FLATPAK_GPG_PRIVATE_KEY and a required reviewer: a job that names a missing environment makes GitHub create it unprotected, and then a repository secret of the same name is readable here. It needs check-flatpak, so the approval is asked only after every check is green. The secret is given to the --sign step alone, which makes no commit, no appstream data and no delta
  sign-flatpak:
    needs: [validate, ci-gate, build-flatpak, prepare-flatpak, check-flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-signing
    permissions:
      contents: read
    outputs:
      signed_sha256: ${{ steps.sign.outputs.signed_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # No container image: the key is loaded where only the runner image and the distribution's signed packages run. Done before the secret exists
      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree
          flatpak --version
          ostree --version | head -n 2

      # The refs.txt of the build, checked against the hash of build-flatpak in the next step
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-refs
          path: flatpak-refs

      # The artifact of check-flatpak by its id, not by a name another job could also have used. merge-multiple puts its two files straight into the folder
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check-flatpak.outputs.artifact_id }}
          merge-multiple: true
          path: flatpak-checked

      # Not in the step with the secret, whose environment any child process could read
      - name: Unpack what check-flatpak checked
        env:
          EXPECT_CHECKED_SHA256: ${{ needs.check-flatpak.outputs.checked_sha256 }}
          EXPECT_SIGNLIST_SHA256: ${{ needs.prepare-flatpak.outputs.signlist_sha256 }}
          EXPECT_REFS_SHA256: ${{ needs.build-flatpak.outputs.refs_sha256 }}
          EXPECT_HEADS_SHA256: ${{ needs.prepare-flatpak.outputs.heads_sha256 }}
        run: build/release/sign-flatpak-repo.sh --unpack flatpak-checked/checked-repo.tar flatpak-checked/sign-list.txt flatpak-refs/refs.txt "$RUNNER_TEMP/flatpak-sign-work"

      - name: Sign the Flatpak repository
        id: sign
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: build/release/sign-flatpak-repo.sh --sign "$RUNNER_TEMP/flatpak-sign-work" flatpak-signed

      - name: Remove the keyring and the work folder
        if: always()
        run: build/release/sign-flatpak-repo.sh --cleanup "$RUNNER_TEMP/flatpak-sign-work"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-signed
          path: flatpak-signed/signed-repo.tar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # No secret, another machine: trusts nothing the signing job returned. It checks that the signed repository is the prepared one plus signatures, that a client with only the public key accepts it (a remote install, which honours --no-deploy), and writes the site archive and the signed bundle without installing it
  finish-flatpak:
    needs: [validate, build-flatpak, prepare-flatpak, sign-flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      site_sha256: ${{ steps.finish.outputs.site_sha256 }}
      flatpak_sha256: ${{ steps.finish.outputs.flatpak_sha256 }}
      base_sha: ${{ steps.finish.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree appstream librsvg2-common
          flatpak --version
          ostree --version | head -n 2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-prepared
          path: flatpak-prepared

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-signed
          path: flatpak-signed

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-refs
          path: flatpak-refs

      - name: Check the signed repository and write the site and the bundle
        id: finish
        env:
          EXPECT_PREPARED_SHA256: ${{ needs.prepare-flatpak.outputs.prepared_sha256 }}
          EXPECT_SIGNLIST_SHA256: ${{ needs.prepare-flatpak.outputs.signlist_sha256 }}
          EXPECT_SIGNED_SHA256: ${{ needs.sign-flatpak.outputs.signed_sha256 }}
          EXPECT_REFS_SHA256: ${{ needs.build-flatpak.outputs.refs_sha256 }}
          EXPECT_BASE_SHA: ${{ needs.prepare-flatpak.outputs.base_sha }}
        run: build/release/finish-flatpak-repo.sh flatpak-prepared/prepared.tar flatpak-prepared/sign-list.txt flatpak-signed/signed-repo.tar flatpak-refs/refs.txt flatpak-finished

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-site
          path: flatpak-finished/site.tar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-flatpak
          path: flatpak-finished/Kinefin-x86_64.flatpak
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # The only job that installs the signed bundle: flatpak deploys a bundle even with --no-deploy (exports, host triggers), so it holds no write, signing or attestation permission, no token, no secret and no environment, and it has no outputs and uploads nothing, so that what the bundle does on deploy cannot choose what attest-flatpak and publish trust. attest-flatpak and publish need it, so a bundle that fails here is never attested or published
  check-bundle:
    needs: [build-flatpak, finish-flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree
          flatpak --version
          ostree --version | head -n 2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asset-flatpak
          path: asset-flatpak

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-refs
          path: flatpak-refs

      - name: Install the bundle as a user and check what was installed
        env:
          EXPECT_FLATPAK_SHA256: ${{ needs.finish-flatpak.outputs.flatpak_sha256 }}
          EXPECT_REFS_SHA256: ${{ needs.build-flatpak.outputs.refs_sha256 }}
        run: build/release/check-flatpak-bundle.sh asset-flatpak/Kinefin-x86_64.flatpak flatpak-refs/refs.txt

  # The only job that may attest. It runs no project script on the bundle: it checks the bytes against the hash finish-flatpak reported and attests them
  attest-flatpak:
    needs: [finish-flatpak, check-bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Sign the exact signed Flatpak with an OIDC-bound Sigstore identity
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asset-flatpak
          path: asset-flatpak

      - name: Check the bundle against the hash of finish-flatpak
        env:
          EXPECT_SHA256_FLATPAK: ${{ needs.finish-flatpak.outputs.flatpak_sha256 }}
        run: echo "$EXPECT_SHA256_FLATPAK  asset-flatpak/Kinefin-x86_64.flatpak" | sha256sum -c -

      # GitHub stores the Sigstore attestation separately from the three release assets
      - name: Attest the signed Flatpak
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: asset-flatpak/Kinefin-x86_64.flatpak

  verify:
    needs: [build-flatpak, finish-flatpak, attest-flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asset-flatpak
          path: release-assets

      - name: Verify signed build attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -I build/release/verify_attestation.py \
            release-assets/Kinefin-x86_64.flatpak \
            --repository "$RELEASE_REPOSITORY" \
            --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"

      - name: Record build provenance and verify both checksums
        env:
          EXPECT_SHA256_FLATPAK: ${{ needs.finish-flatpak.outputs.flatpak_sha256 }}
          RELEASE_IMAGE_DIGEST: ${{ needs.build-flatpak.outputs.image_digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          # Validate the downloaded bundle against the digest produced by
          # the finish job, before producing or uploading any provenance.
          echo "$EXPECT_SHA256_FLATPAK  release-assets/Kinefin-x86_64.flatpak" | sha256sum -c -
          python3 -I build/release/create_provenance.py \
            --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" \
            --repository "$RELEASE_REPOSITORY" --run-id "$RELEASE_RUN_ID" \
            --image-digest "$RELEASE_IMAGE_DIGEST" \
            --bundle release-assets/Kinefin-x86_64.flatpak \
            --expected-sha256 "$EXPECT_SHA256_FLATPAK" \
            --output release-assets/PROVENANCE.json
          (cd release-assets && \
            sha256sum Kinefin-x86_64.flatpak PROVENANCE.json > SHA256SUMS && \
            sha256sum -c SHA256SUMS)
          # Verify the downloadable three-file set with the same strict
          # offline audit documented for users, before uploading it.
          python3 -I build/release/verify_release_assets.py \
            "$RELEASE_TAG" release-assets \
            --commit "$RELEASE_COMMIT" --repository "$RELEASE_REPOSITORY" \
            --run-id "$RELEASE_RUN_ID" --image-digest "$RELEASE_IMAGE_DIGEST" \
            --expected-sha256 "$EXPECT_SHA256_FLATPAK"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # The only job with write permission. It rebuilds nothing and can be run again after a failure: it does only what is missing. The 30 minutes cover the caps of its long steps (the gh-pages push 10, the Pages wait 10, the list wait 1) and the asset uploads
  publish:
    needs: [validate, ci-gate, build-flatpak, finish-flatpak, check-bundle, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-site
          path: flatpak-site

      # Rerun verification on retries, including existing draft releases.
      - name: Verify signed release attestation before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -I build/release/verify_attestation.py \
            release-assets/Kinefin-x86_64.flatpak \
            --repository "$RELEASE_REPOSITORY" \
            --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"

      - name: Publish only after verifying both uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          # The publisher resolves the current remote Git tag and requires it
          # to still point at the commit whose Flatpak was built in this run.
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_IMAGE_DIGEST: ${{ needs.build-flatpak.outputs.image_digest }}
          SITE_TAR: flatpak-site/site.tar
          EXPECT_SITE_SHA256: ${{ needs.finish-flatpak.outputs.site_sha256 }}
          SITE_BASE_SHA: ${{ needs.finish-flatpak.outputs.base_sha }}
        run: python3 -I build/release/publish_release.py "$RELEASE_TAG" release-assets
