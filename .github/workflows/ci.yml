name: CI

# Pull requests, pushes to main and manual runs. Tags do not run it again: a release needs the `required` job green on its commit (release.yml, ci-gate). There is no path filter on the triggers (a skipped workflow would leave a required check pending): the `changes` job decides what runs, and `required` checks that every skip was intended.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Only a pull request cancels its older run (per ref). A run on main always finishes: the release gate (release.yml, ci-gate) needs the finished run of the tagged commit, and the images of a push are decided on that push alone. Manual runs finish too.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: "1.31.1"
      ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
    outputs:
      code: ${{ steps.changes.outputs.code }}
      packaging: ${{ steps.changes.outputs.packaging }}
      images: ${{ steps.changes.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the jobs
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: build/ci/changes.sh

      - name: Verify immutable GitHub Actions references
        run: python3 -I build/release/verify_action_pins.py

      - name: Verify pinned Flatpak runtimes
        run: python3 -I build/release/verify_runtime_pins.py

      - name: Verify immutable Flatpak sources
        run: python3 -I build/release/verify_flatpak_sources.py

      - name: Verify release artwork and desktop metadata
        run: python3 -I build/release/verify_release_branding.py

      - name: Verify reviewed Flatpak sandbox permissions
        run: python3 -I build/release/verify_flatpak_permissions.py

      - name: shellcheck
        run: |
          shellcheck --version
          find build scripts po \( -name '*.sh' -o -name '*.hook' \) -print0 | xargs -0 shellcheck -x --severity=warning

      - name: Install actionlint and zizmor
        run: |
          dir="$RUNNER_TEMP/lint-tools"
          mkdir -p "$dir"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$dir/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" actionlint
          tarball="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$dir/$tarball" "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/$tarball"
          echo "$ZIZMOR_SHA256  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" zizmor
          echo "$dir" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        run: zizmor --offline .github/workflows

  images:
    needs: changes
    if: contains(fromJSON('["true", "maybe"]'), needs.changes.outputs.images)
    permissions:
      contents: read
      packages: write
    # The workspace-relative form: the `$/` form of GitHub's July 2026 syntax is not yet known to every tool of the lint job
    uses: ./.github/workflows/images.yml # zizmor: ignore[self-repository]

  check:
    needs: [changes, images]
    # `!cancelled()` lets it run after a skipped `images`; a failed `images` (or `changes`) still keeps it from starting, and `required` fails on that
    if: >-
      !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.images.result)
      && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      # The UI tests wait this many times longer: the runner is several times slower than a development machine
      KINEFIN_TEST_TIMEOUT_SCALE: 3
      # The compiler cache lives outside the checkout (the REUSE gate scans it); the source and build paths are the same on every run, so the hashes match
      CCACHE_DIR: /buildtmp/ccache
      CCACHE_MAXSIZE: 1200M
      CCACHE_COMPRESS: "1"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
    container:
      image: ghcr.io/the-beper/kinefin-build:fedora45
      # Without credentials the pull is anonymous, and ghcr answers 403 for a private image.
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The key is unique per commit and only a push to main saves one: a pull request restores the newest cache of the same image and adds none
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /buildtmp/ccache
          key: ccache-fedora45-${{ hashFiles('build/Containerfile') }}-${{ github.sha }}
          restore-keys: |
            ccache-fedora45-${{ hashFiles('build/Containerfile') }}-
            ccache-fedora45-

      - name: Checks
        run: build/check.sh

      # Also after failing tests: the compiled objects are worth keeping
      - name: Save the compiler cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /buildtmp/ccache
          key: ccache-fedora45-${{ hashFiles('build/Containerfile') }}-${{ github.sha }}

      # Every save adds an entry that nothing replaces: keep the two newest, or the 10 GB of the repository fill up and push out the other caches
      - name: Prune the old compiler caches
        continue-on-error: true
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I build/ci/prune_caches.py ccache-fedora45- 2

  flatpak:
    needs: [changes, images]
    # As in `check`
    if: >-
      !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.images.result)
      && needs.changes.outputs.packaging == 'true'
    # Pinned runner image, as the release's build-flatpak: the same podman, flatpak and ostree.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # The flatpak image is private on ghcr: log podman into it with this token.
      packages: read
      # Pruning the old Flatpak build states
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull the build image
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | podman login ghcr.io -u "$GHCR_USER" --password-stdin
          podman pull ghcr.io/the-beper/kinefin-flatpak:fedora45
          podman tag ghcr.io/the-beper/kinefin-flatpak:fedora45 localhost/kinefin-flatpak:fedora45

      - name: Name the month of the cache
        id: month
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # The module cache, the sources and the ccache, without the build trees (most of the size, and rebuilt anyway). The v1 in the key is bumped to drop every saved state at once
      - name: Restore the Flatpak build state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/flatpak-state/cache
            ${{ runner.temp }}/flatpak-state/checksums
            ${{ runner.temp }}/flatpak-state/downloads
            ${{ runner.temp }}/flatpak-state/git
            ${{ runner.temp }}/flatpak-state/ccache
          key: flatpak-state-v1-${{ steps.month.outputs.value }}-${{ github.sha }}
          restore-keys: flatpak-state-v1-${{ steps.month.outputs.value }}-

      - name: Build Flatpak
        id: build
        env:
          KINEFIN_FLATPAK_STATE_DIR: ${{ runner.temp }}/flatpak-state
        run: build/flatpak/build-flatpak.sh

      # Right after the build, also when it failed or ran out of time: the modules it finished are kept, so a build that is too long for one run converges
      - name: Save the Flatpak build state
        if: always() && github.event_name == 'push' && steps.build.conclusion != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/flatpak-state/cache
            ${{ runner.temp }}/flatpak-state/checksums
            ${{ runner.temp }}/flatpak-state/downloads
            ${{ runner.temp }}/flatpak-state/git
            ${{ runner.temp }}/flatpak-state/ccache
          key: flatpak-state-v1-${{ steps.month.outputs.value }}-${{ github.sha }}

      - name: Prune the old Flatpak build states
        continue-on-error: true
        if: always() && github.event_name == 'push' && steps.build.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I build/ci/prune_caches.py flatpak-state-v1- 2

      - name: Smoke test (mandatory after packaging succeeds)
        run: build/flatpak/test-flatpak.sh dist/Kinefin-x86_64.flatpak

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Kinefin-x86_64.flatpak
          path: dist/Kinefin-x86_64.flatpak
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  required:
    if: always()
    needs: [changes, images, check, flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      NEEDS: ${{ toJSON(needs) }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Verify the results
        run: |
          python3 -I - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS"])
          # job -> the `changes` output that makes it mandatory (None: always)
          flag_of = {
              "images": "images",
              "check": "code",
              "flatpak": "packaging",
          }

          changes = needs.get("changes", {})
          flags = changes.get("outputs") or {}
          failed = False
          rows = []

          result = changes.get("result", "missing")
          failed = failed or result != "success"
          rows.append(("changes", result, "yes", "ok" if result == "success" else "FAIL"))

          for job, flag in flag_of.items():
              result = needs.get(job, {}).get("result", "missing")
              if flag is None:
                  wanted = True
              elif flags.get(flag) in ("true", "false", "maybe"):
                  # "maybe" (images, unknown pushed range): the job runs, so only a skip is wrong
                  wanted = flags[flag] != "false"
              else:
                  rows.append((job, result, "?", "FAIL (changes gave no '%s' flag)" % flag))
                  failed = True
                  continue
              if result == "success":
                  verdict = "ok"
              elif result == "skipped" and not wanted:
                  verdict = "skipped on purpose"
              else:
                  verdict = "FAIL"
                  failed = True
              needed = "maybe" if flags.get(flag) == "maybe" else "yes" if wanted else "no"
              rows.append((job, result, needed, verdict))

          print("%-10s %-10s %-7s %s" % ("job", "result", "needed", "verdict"))
          for row in rows:
              print("%-10s %-10s %-7s %s" % row)
          sys.exit(1 if failed else 0)
          PY
